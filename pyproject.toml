[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[project]
name = "cbr2cbz"
version = "0.1.0"
description = "Convert comic books from CBR to CBZ format"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.1",
    "loguru>=0.7.3",
]

[project.scripts]
cbr2cbz = "cbr2cbz.cli:convert"
